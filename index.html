<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1f0">
  <meta name="description" content="Download the project archive.">
  <title>Download</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #edf1f0;
      --ink: #19343b;
      --signal: #d94d37;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background-color: var(--paper);
      background-image: linear-gradient(#dfe7e5 1px, transparent 1px), linear-gradient(90deg, #dfe7e5 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .download {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--signal);
      border: 0;
      border-radius: 50%;
      box-shadow: 0 12px 32px #19343b20;
      transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .download:hover {
      background: #bd412e;
      transform: translateY(-3px);
      box-shadow: 0 16px 36px #19343b2b;
    }

    .download:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 6px;
    }

    .download svg { width: 38px; height: 38px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="download" href="https://github.com/batha-kari/bsp/archive/refs/heads/master.zip" aria-label="Download the complete project as a ZIP archive">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v4h16v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</body>
</html>
